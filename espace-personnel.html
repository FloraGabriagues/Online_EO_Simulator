<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace personnel — du photon au pixel</title>
<style>
:root{
  --void:#090E13; --panel:#131E27; --panel-2:#1A2833;
  --line:#2E4152; --line-soft:#22323F;
  --paper:#E6EEF4; --muted:#9BADBD; --muted-2:#8497AA;
  --photon:#F5AC57; --pixel:#5FDCD0; --alert:#F0776D; --ok:#7FD88F;
  --display:"Barlow Condensed",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 26px 90px}

header{padding:28px 0 18px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;
  letter-spacing:.04em}
.back:hover{color:var(--pixel)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:16px 0 6px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.6vw,38px);margin:0}
.rail-bar{height:4px;border-radius:2px;margin:20px 0 34px;
  background:linear-gradient(90deg,var(--photon) 0%,#CFA268 34%,#86BCA6 66%,var(--pixel) 100%)}

.createcard{display:flex;align-items:center;gap:20px;
  width:100%;appearance:none;cursor:pointer;text-decoration:none;
  background:var(--panel);border:1px solid var(--line);color:var(--paper);
  border-radius:8px;padding:22px 26px;margin-bottom:40px;transition:border-color .14s,background .14s}
.createcard:hover{border-color:var(--pixel);background:#16232B}
.createcard .icon{flex:none;width:52px;height:52px;border-radius:50%;
  background:rgba(95,220,208,.12);border:1px solid var(--pixel);
  display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--pixel);
  font-family:var(--display)}
.createcard .lab{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 3px}
.createcard .sub{font-size:13.5px;color:var(--muted);margin:0}
.createcard .arrow{margin-left:auto;font-size:20px;color:var(--muted-2)}

.sectiontitle{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.sectiontitle .dot{width:6px;height:6px;border-radius:50%;background:var(--pixel)}

.instgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;margin-bottom:44px}
.instcard{display:flex;flex-direction:column;gap:14px;
  text-decoration:none;color:var(--paper);background:var(--panel);
  border:1px solid var(--line-soft);border-radius:8px;padding:18px 20px;
  transition:border-color .14s,background .14s,transform .14s}
.instcard:hover{border-color:var(--pixel);background:#16232B;transform:translateY(-2px)}
.instcard .top{display:flex;align-items:flex-start;gap:12px}
.instcard .glyph{flex:none;width:38px;height:38px;border-radius:6px;
  background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.instcard .glyph svg{width:20px;height:20px}
.instcard .name{font-weight:500;font-size:15.5px}
.instcard .type{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;
  text-transform:uppercase;letter-spacing:.05em}
.instcard .meta{font-size:12px;color:var(--muted-2);margin-top:auto}
.instcard .pctrow{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:11px;color:var(--muted);margin-bottom:5px}
.instcard .track{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.instcard .fill{height:100%;background:var(--pixel)}
.instcard.empty{align-items:center;justify-content:center;color:var(--muted);
  font-size:14px;cursor:default;border-style:dashed}
.instcard.empty:hover{border-color:var(--line-soft);background:var(--panel);transform:none}

.activity{border-top:1px solid var(--line-soft);padding-top:22px}
.activity ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.activity li{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.activity li .adot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.activity li span:last-child{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted-2);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back" href="index.html">← Retour à la démo</a>
    <p class="eyebrow">Espace personnel</p>
    <h1>Bonjour, Flora</h1>
    <div class="rail-bar"></div>
  </header>

  <a class="createcard" href="creer-instrument.html">
    <span class="icon">+</span>
    <span>
      <p class="lab">Créer un instrument</p>
      <p class="sub">Multispectral, à partir d'un fichier ou renseigné manuellement</p>
    </span>
    <span class="arrow">→</span>
  </a>

  <p class="sectiontitle"><span class="dot"></span>Mes instruments</p>
  <div class="instgrid" id="instList"></div>

  <div class="activity">
    <p class="sectiontitle"><span class="dot"></span>Activité récente</p>
    <ul id="activityList"></ul>
  </div>

</div>

<script>
// Pas de backend pour l'instant : liste illustrative + relecture du brouillon
// laissé par la page de création (mêmes clés localStorage que creer-instrument.html).
var DEMO_INSTRUMENTS = [
  {name:"SPEO 500", type:"Multispectral", pct:82, meta:"Modifié le 12/09/2026"},
  {name:"Instrument test", type:"Multispectral", pct:35, meta:"Modifié le 03/09/2026"}
];

var GLYPH = "<svg viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'>"+
  "<ellipse cx='12' cy='7' rx='7' ry='2.4' stroke='var(--pixel)' stroke-width='1.4'/>"+
  "<path d='M5 7v6c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4V7' stroke='var(--pixel)' stroke-width='1.4'/>"+
  "<line x1='12' y1='15.4' x2='12' y2='19' stroke='var(--muted-2)' stroke-width='1.4'/>"+
  "</svg>";

function readDraft(){
  try{
    var name = localStorage.getItem("dpap_instrument_name_v1");
    var raw = localStorage.getItem("dpap_instrument_draft_v1");
    if(!name || !raw) return null;
    var values = JSON.parse(raw);
    var keys = Object.keys(values).filter(function(k){ return values[k] !== "" && values[k] !== null; });
    if(keys.length === 0) return null;
    return {name:name, filled:keys.length};
  }catch(e){ return null; }
}

var list = document.getElementById("instList");
var draft = readDraft();
var items = DEMO_INSTRUMENTS.slice();
if(draft && !items.some(function(i){ return i.name === draft.name; })){
  items.unshift({name: draft.name, type:"Multispectral", pct: Math.min(100, draft.filled * 8),
    meta:"Brouillon local", isDraft:true});
}

items.forEach(function(it){
  var a = document.createElement("a");
  a.className = "instcard";
  a.href = "creer-instrument.html";
  a.innerHTML =
    "<div class='top'><span class='glyph'>"+GLYPH+"</span>"+
    "<span><div class='name'>"+it.name+"</div><div class='type'>"+it.type+
    (it.isDraft ? " · brouillon" : "")+"</div></span></div>"+
    "<div><div class='pctrow'><span>Configuration</span><span>"+it.pct+" %</span></div>"+
    "<div class='track'><div class='fill' style='width:"+it.pct+"%'></div></div></div>"+
    "<div class='meta'>"+it.meta+"</div>";
  list.appendChild(a);
});
if(items.length === 0){
  list.innerHTML = "<div class='instcard empty'>Aucun instrument pour l'instant</div>";
}

var activityEl = document.getElementById("activityList");
var activities = draft
  ? [["Brouillon "+draft.name+" en cours", "à l'instant"]]
  : [["Aucune activité récente", ""]];
activityEl.innerHTML = activities.map(function(a){
  return "<li><span class='adot'></span><span>"+a[0]+"</span><span>"+a[1]+"</span></li>";
}).join("");
</script>
</body>
</html>
