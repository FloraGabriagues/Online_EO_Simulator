<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Nysa</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Ccircle%20cx%3D%2224.00%22%20cy%3D%2213.70%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2232.92%22%20cy%3D%2218.85%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2232.92%22%20cy%3D%2229.15%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2224.00%22%20cy%3D%2234.30%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2215.08%22%20cy%3D%2229.15%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2215.08%22%20cy%3D%2218.85%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%225.3%22%20fill%3D%22%23FFB86B%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --void:#090E13; --panel:#131E27; --panel-2:#1A2833;
  --line:#2E4152; --line-soft:#22323F;
  --paper:#C4D6D4; --muted:#9BADBD; --muted-2:#8497AA;
  --photon:#F5AC57; --pixel:#5FDCD0; --alert:#F0776D; --ok:#7FD88F;
  --display:"Montserrat","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--void);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:8px;padding:32px 30px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.brand .mark{flex:none;width:32px;height:32px;display:block}
.brand .mark svg{width:100%;height:100%;display:block}
.brand .name{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:.035em;line-height:1.05}
.brand .tag{font-family:var(--display);font-weight:400;font-size:8.4px;letter-spacing:.115em;color:var(--muted-2);margin-top:3px;white-space:nowrap}

h1{font-family:var(--display);font-weight:500;font-size:21px;
  margin:0 0 6px;letter-spacing:-.012em}
.sub{font-size:13px;color:var(--muted);margin:0 0 22px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-soft);margin-bottom:22px}
.tab{flex:1;background:none;border:none;color:var(--muted-2);font-family:var(--mono);
  font-size:12.5px;letter-spacing:.03em;padding:10px 0;border-bottom:2px solid transparent;
  cursor:pointer;text-transform:uppercase}
.tab[aria-selected="true"]{color:var(--pixel);border-color:var(--pixel)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.field input{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line-soft);
  color:var(--paper);border-radius:5px;padding:10px 13px;font-family:var(--body);font-size:14px}
.field input:focus{outline:none;border-color:var(--pixel)}

.submitbtn{width:100%;border:1px solid var(--pixel);background:var(--pixel);color:#0A141A;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em;
  padding:11px 18px;border-radius:5px;cursor:pointer;margin-top:6px;
  box-shadow:0 2px 10px rgba(95,220,208,.22);transition:background .14s}
.submitbtn:hover{background:#7CE8DC}
.submitbtn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

.msg{font-size:12.5px;margin-top:14px;padding:10px 12px;border-radius:5px;display:none}
.msg.err{display:block;background:rgba(240,119,109,.1);border:1px solid rgba(240,119,109,.3);color:var(--alert)}
.msg.ok{display:block;background:rgba(127,216,143,.1);border:1px solid rgba(127,216,143,.3);color:var(--ok)}

.formview{display:none}
.formview.current{display:block}
/* 05/10/2026 — charte Nysa : logo plus présent sur la page de connexion */
.brand{gap:13px;margin-bottom:30px}
.brand .mark{width:42px;height:42px}
.brand .name{font-size:27px}
.brand .tag{font-size:10px;margin-top:4px}
</style>
</head>
<body>
<!-- Bandeau « version bêta » : se désactive dans beta.js (BETA_ACTIVE = false) -->
<script src="beta.js"></script>
<div class="card">
  <div class="brand">
    <!-- 05/10/2026 — logo Nysa : la fleur à six pétales -->
      <span class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24.00" cy="13.70" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="32.92" cy="18.85" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="32.92" cy="29.15" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="24.00" cy="34.30" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="15.08" cy="29.15" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="15.08" cy="18.85" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="24" cy="24" r="5.3" fill="#FFB86B"/></svg></span>
    <span>
      <div class="name">Nysa</div>
      <div class="tag">EO Imaging Engineering</div>
    </span>
  </div>

  <div id="authArea">
    <h1>Accès au simulateur complet</h1>
    <p class="sub">Connectez-vous ou créez un compte pour accéder à vos instruments et résultats.</p>

    <div class="tabs" role="tablist">
      <button class="tab" type="button" data-view="login" aria-selected="true">Se connecter</button>
      <button class="tab" type="button" data-view="signup" aria-selected="false">Créer un compte</button>
    </div>

    <!-- ============ Connexion ============ -->
    <form class="formview current" id="loginForm" data-view="login">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPassword">Mot de passe</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button class="submitbtn" type="submit">Se connecter</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- ============ Inscription ============ -->
    <form class="formview" id="signupForm" data-view="signup">
      <div class="field">
        <label for="signupEmail">E-mail</label>
        <input type="email" id="signupEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="signupPassword">Mot de passe</label>
        <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
      </div>
      <!-- 05/10/2026 — confirmation du mot de passe : une faute de frappe à
           l'inscription créait un compte dont personne ne connaissait le mot de passe. -->
      <div class="field">
        <label for="signupPassword2">Confirmer le mot de passe</label>
        <input type="password" id="signupPassword2" required minlength="6" autocomplete="new-password">
      </div>
      <button class="submitbtn" type="submit">Créer mon compte</button>
      <div class="msg" id="signupMsg"></div>
    </form>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
// Si déjà connecté, inutile de repasser par cette page.
supabaseClient.auth.getSession().then(function(res){
  if (res.data.session) window.location.href = "espace-personnel.html";
});

// Déconnecté·e automatiquement car ce compte a été utilisé ailleurs
// (une seule session active à la fois, cf. requireAuth dans supabase-client.js).
var urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("reason") === "other_device") {
  var banner = document.createElement("div");
  banner.className = "msg err";
  banner.style.display = "block";
  banner.style.marginBottom = "20px";
  banner.textContent = "Vous avez été déconnecté car ce compte a été utilisé sur un autre appareil. Une seule connexion à la fois est autorisée.";
  document.getElementById("authArea").insertBefore(banner, document.getElementById("authArea").firstChild);
}

// Retour après la suppression d'un compte (cf. espace-personnel.html,
// Paramètres > Suppression) — confirmation que tout a été effacé.
if (urlParams.get("reason") === "account_deleted") {
  var delBanner = document.createElement("div");
  delBanner.className = "msg ok";
  delBanner.style.display = "block";
  delBanner.style.marginBottom = "20px";
  delBanner.textContent = "Votre compte et vos données ont été supprimés.";
  document.getElementById("authArea").insertBefore(delBanner, document.getElementById("authArea").firstChild);
}

// ===================== Bascule connexion / inscription =====================
document.querySelectorAll(".tab").forEach(function(tab){
  tab.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", "false"); });
    tab.setAttribute("aria-selected", "true");
    document.querySelectorAll(".formview").forEach(function(v){
      v.classList.toggle("current", v.dataset.view === tab.dataset.view);
    });
  });
});

// ===================== Connexion =====================
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var btn = e.target.querySelector(".submitbtn");
  var msgEl = document.getElementById("loginMsg");
  msgEl.className = "msg"; msgEl.textContent = "";
  btn.disabled = true;

  var email = document.getElementById("loginEmail").value.trim();
  var password = document.getElementById("loginPassword").value;

  var { data: loginData, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

  btn.disabled = false;
  if (error) {
    msgEl.className = "msg err";
    msgEl.textContent = frenchAuthError(error);
    return;
  }
  await registerSessionMarker(loginData.user.id);
  window.location.href = "espace-personnel.html";
});

// ===================== Inscription =====================
document.getElementById("signupForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var btn = e.target.querySelector(".submitbtn");
  var msgEl = document.getElementById("signupMsg");
  msgEl.className = "msg"; msgEl.textContent = "";
  btn.disabled = true;

  var email = document.getElementById("signupEmail").value.trim();
  var password = document.getElementById("signupPassword").value;

  // Les deux saisies doivent être identiques : sinon rien n'est envoyé.
  var password2El = document.getElementById("signupPassword2");
  if (password !== password2El.value) {
    btn.disabled = false;
    msgEl.className = "msg err";
    msgEl.textContent = "Les deux mots de passe ne sont pas identiques.";
    password2El.focus();
    password2El.select();
    return;
  }

  // 04/10/2026 — adresse de retour du lien de confirmation envoyé par e-mail.
  // Sans elle, Supabase utilise son « Site URL », qui vaut localhost:3000
  // par défaut : le lien menait à une page inaccessible. On revient sur
  // cette page de connexion, à l'adresse réelle du site. Cette adresse doit
  // aussi figurer dans Supabase (Authentication > URL Configuration >
  // Redirect URLs), sinon Supabase l'ignore.
  var { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: { emailRedirectTo: new URL("login.html", window.location.href).href }
  });

  btn.disabled = false;
  if (error) {
    msgEl.className = "msg err";
    msgEl.textContent = frenchAuthError(error);
    return;
  }

  // Selon la configuration du projet Supabase, une confirmation par e-mail
  // peut être requise avant que la session soit active (data.session est
  // alors null même si le compte est bien créé).
  if (!data.session) {
    msgEl.className = "msg ok";
    msgEl.textContent = "Compte créé. Vérifiez votre boîte mail pour confirmer votre adresse avant de vous connecter.";
    return;
  }
  await registerSessionMarker(data.user.id);
  window.location.href = "espace-personnel.html";
});
</script>
</body>
</html>
