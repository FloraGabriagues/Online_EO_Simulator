<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer un instrument — du photon au pixel</title>
<style>
:root{
  --void:#090E13; --panel:#131E27; --panel-2:#1A2833;
  --line:#2E4152; --line-soft:#22323F;
  --paper:#E6EEF4; --muted:#9BADBD; --muted-2:#8497AA;
  --photon:#F5AC57; --pixel:#5FDCD0; --alert:#F0776D; --ok:#7FD88F;
  --display:"Barlow Condensed",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 26px 90px}

header{padding:20px 0;border-bottom:1px solid var(--line-soft);margin-bottom:22px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;
  letter-spacing:.04em}
.back:hover{color:var(--pixel)}

.filebtn{appearance:none;cursor:pointer;width:100%;background:var(--photon);
  border:1px solid var(--photon);color:#2A1B08;border-radius:4px;
  padding:13px 14px;font-family:var(--body);font-size:14px;font-weight:500;text-align:left;
  display:flex;align-items:center;gap:10px;transition:background .14s,border-color .14s;
  margin-bottom:20px}
.filebtn:hover{background:#FFBE72;border-color:#FFBE72}
.filebtn input[type=file]{display:none}
.sidefield{margin-bottom:16px}

.sidefield label{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sidefield input,.sidefield select{width:100%;background:var(--panel-2);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:9px 10px;font-family:var(--body);
  font-size:14px}
.sidefield input::placeholder{color:var(--muted-2)}


.progresswrap{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
.progresswrap .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;
  color:var(--muted);margin-bottom:7px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em}
.progresswrap .row span:last-child{font-size:13px;letter-spacing:0;text-transform:none;color:var(--pixel)}
.progresswrap .track{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.progresswrap .fill{height:100%;background:var(--pixel);transition:width .25s ease}

.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}

.leftcol{display:flex;flex-direction:column;gap:20px;min-width:0;
  position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto}
.chain{display:flex;flex-direction:column;gap:0;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:8px;padding:20px}
.configrow{display:flex;flex-direction:column}
.configrow .sidefield{margin-bottom:16px}
.configrow .filebtn{width:100%}
.chainlistcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:20px}
.subhead{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.subhead .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--photon)}
.chain-arrow{display:flex;justify-content:center;color:var(--muted-2);font-size:16px;padding:2px 0}
.ctx-node{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:4px;
  border:1px solid var(--line-soft);opacity:.5}
.ctx-node .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:none}
.ctx-node .lab{font-size:13.5px;font-weight:500}
.ctx-node .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted-2)}

.schemawrap{margin-bottom:14px;overflow-x:auto}
.schemawrap svg{display:block;min-width:520px;width:100%;height:auto;max-height:110px}
.rightcol{display:flex;flex-direction:column;min-width:0}
.schema-label{font-family:var(--mono);font-size:11px;fill:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.schema-block{cursor:pointer;transition:opacity .18s,filter .18s}
.schema-block{opacity:.72}
.schema-block:hover{opacity:.92}
.schema-block.active{opacity:1}
.schema-iconframe{stroke:var(--line);fill:var(--panel-2);transition:stroke .18s,stroke-width .18s}
.schema-block.active .schema-iconframe{stroke:var(--pixel);stroke-width:2}
.schema-block .schema-glow{opacity:.5;transition:opacity .18s}
.schema-block.active .schema-glow{opacity:1}
.schema-blocklabel{font-family:var(--body);font-size:13px;fill:var(--paper);font-weight:500}

.instgroup{background:transparent}
.instgroup .grouphead{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.instgroup .grouphead .dot{width:7px;height:7px;border-radius:50%;background:var(--pixel)}

.blocklist{border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.blockbtn{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:13px 14px;background:transparent;border:0;
  border-bottom:1px solid var(--line-soft);color:var(--paper);cursor:pointer;
  font-family:var(--body);font-size:14px;text-align:left;
  border-left:2px solid transparent;
  opacity:.68;transition:opacity .15s,border-color .15s,background .15s}
.blocklist .blockbtn:last-child{border-bottom:0}
.blockbtn:hover{opacity:.9}
.blockbtn.active{opacity:1;border-left-color:var(--pixel);background:rgba(95,220,208,.06);color:var(--pixel)}
.blockbtn .lab{font-weight:500}
.status{font-family:var(--mono);font-size:13px;color:var(--muted-2);width:16px;text-align:center;flex:none}
.status.ok{color:var(--ok)}
.status.warn{color:var(--photon)}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;
  padding:16px 20px}
.panel h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px}
.panel .desc{font-size:13px;color:var(--muted);margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field .row{display:flex;gap:10px;align-items:center}
.field input[type=number],.field input[type=text]{flex:1;background:var(--panel-2);
  border:1px solid var(--line);border-radius:3px;color:var(--paper);padding:9px 11px;
  font-family:var(--mono);font-size:14px}
.field input::placeholder{color:var(--muted-2);font-family:var(--body);font-style:italic}
.field .unit{font-family:var(--mono);font-size:12px;color:var(--muted-2);min-width:34px}
.field input:focus{outline:none;border-color:var(--pixel)}
.panel-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line-soft)}
.panel-actions .rightbtns{display:flex;gap:10px;margin-left:auto}
.btn{appearance:none;cursor:pointer;border-radius:4px;padding:10px 18px;
  font-family:var(--body);font-size:14px;font-weight:500;border:1px solid var(--line)}
.btn.primary{background:var(--pixel);color:#052824;border-color:var(--pixel)}
.btn.ghost{background:transparent;color:var(--paper)}
.btn.next{background:transparent;color:var(--pixel);border-color:var(--pixel)}

.savehint{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);margin-top:10px;
  min-height:16px}

.wfecases{border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;margin-bottom:14px}
.wfecases .wfehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wfecases .wfehead label{font-size:13px;color:var(--muted);margin:0}
.wfecases .wfeaddbtns{display:flex;gap:8px}
.wfecases .wfesub{font-size:11.5px;color:var(--muted-2);margin:0 0 10px}
.wfecases .addcasebtn{appearance:none;cursor:pointer;background:transparent;border:1px solid var(--line);
  color:var(--pixel);border-radius:3px;padding:5px 10px;font-family:var(--mono);font-size:11.5px}
.wfecases .addcasebtn:hover{border-color:var(--pixel)}
.wfecases .caserow{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap;
  border-top:1px solid var(--line-soft)}
.wfecases .caserow .cname{flex:1;font-size:13.5px}
.wfecases .caserow .cfile{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.wfecases .caserow .calign{background:var(--panel-2);color:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:4px 6px;font-family:var(--body);font-size:11.5px;flex:none}
.wfecases .caserow .cdel{appearance:none;cursor:pointer;background:transparent;border:none;
  color:var(--muted-2);font-size:15px;padding:2px 6px}
.wfecases .caserow .cdel:hover{color:var(--alert)}
.wfecases .empty{font-size:12px;color:var(--muted-2);padding:8px 0 2px}

.geo-dim{font-family:var(--mono);font-size:10px;fill:var(--muted-2)}
.optique-grid{display:flex;gap:22px;align-items:stretch;margin-bottom:14px}
.optique-geo-col{flex:1;min-width:0;border:1px solid var(--line-soft);border-radius:6px;
  padding:14px 14px 10px;background:var(--panel-2);display:flex;flex-direction:column}
#opticsGeoSvg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.geo-viewlabel{display:flex;align-items:center;gap:7px;margin-top:6px;flex:none;
  font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.geo-viewlabel svg{flex:none}
/* Une seule colonne pour les champs (revenu en arrière le 18/09/2026 — le
   2-colonnes cassait la mise en page) ; le plan (geo-col) s'étire pour
   matcher cette hauteur, sans hauteur fixe/overflow:hidden qui coupait les
   axes et "Vue de face". */
.optique-fields-col{flex:1;min-width:0}
.optique-fields-col .field{margin-bottom:14px}
@media(max-width:720px){.optique-grid{flex-direction:column}}

.qespectral .qerow{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-top:1px solid var(--line-soft)}
.qespectral .qewl,.qespectral .qeval{flex:1;min-width:0;background:var(--panel-2);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-family:var(--mono);font-size:12.5px}
.qespectral .qedel{appearance:none;cursor:pointer;background:transparent;border:none;
  color:var(--muted-2);font-size:15px;padding:2px 6px;flex:none}
.qespectral .qedel:hover{color:var(--alert)}

.zdetail{margin-bottom:0}
.zpickrow{display:flex;gap:10px;margin-bottom:10px}
.zpickrow select{flex:1;min-width:0;background:var(--panel-2);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;font-family:var(--body);font-size:12.5px}
.zmapwrap{display:flex;gap:16px;align-items:center;padding-top:8px;border-top:1px solid var(--line-soft)}
.zcanvas{flex:none;border-radius:50%;border:1px solid var(--line-soft);image-rendering:pixelated}
.zmapstats{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.9}
.zmapstats b{color:var(--paper)}
.zterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.zterm{display:flex;justify-content:space-between;gap:8px;background:var(--panel-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:5px 8px;font-size:11.5px}
.zterm .zk{color:var(--muted)}
.zterm .zv{font-family:var(--mono);color:var(--pixel)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back" href="espace-personnel.html">← Mes objets</a>
  </header>

  <div class="layout">
    <div class="leftcol">
      <div class="chain instgroup" id="chain">
        <div class="progresswrap">
          <div class="row"><span>Configuration de l'instrument</span><span id="pctLabel">0 %</span></div>
          <div class="track"><div class="fill" id="pctFill" style="width:0%"></div></div>
        </div>
        <p class="subhead"><span class="dot"></span>Configuration</p>
        <div class="configrow">
          <div class="sidefield">
            <label for="instName">Nom de l'instrument</label>
            <input type="text" id="instName" placeholder="Mon instrument">
          </div>
          <div class="sidefield">
            <label for="instType">Type</label>
            <select id="instType">
              <option value="ms">Multispectral</option>
              <option value="hs" disabled>Hyperspectral (bientôt)</option>
            </select>
          </div>
          <button class="filebtn" id="btnFile" type="button">Charger une configuration
            <input type="file" id="fileInput" accept="application/json">
          </button>
        </div>
      </div>
      <div class="chainlistcard instgroup" id="chainList"></div>
    </div>
    <div class="rightcol">
      <div class="schemawrap" id="schemaWrap"></div>
      <div class="panel" id="fieldPanel"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
var SCHEMA = [
  {id:"paysage", kind:"ctx", label:"Paysage L", sub:"scène source"},
  {id:"atmosphere", kind:"ctx", label:"Atmosphère", sub:"modèle atmosphérique"},
  {id:"instrument", kind:"group", label:"Instrument", blocks:[
    {id:"optique", label:"Optique", fields:[
      {k:"I", label:"iFoV", unit:"µrad", placeholder:"obligatoire"},
      {k:"D", label:"Diamètre de pupille", unit:"m", placeholder:"obligatoire"},
      {k:"E", label:"Obscuration centrale", unit:"m", placeholder:"0 (défaut)"},
      // NSUP/ESUP : confirmés le 17/09/2026 (paramFile.Telescope.n_supports/
      // support_width, cf. module_MTF.py) — envoyés au payload de
      // simulation comme PX/QE/ADC (cf. simulations.html).
      {k:"NSUP", label:"Nombre de supports", unit:"", placeholder:"0 (défaut)"},
      {k:"ESUP", label:"Épaisseur des supports", unit:"m", placeholder:"0 (défaut)"},
      {k:"T", label:"Transmission optique", unit:"τ", placeholder:"1 (défaut)"}
    ]},
    {id:"detecteur", label:"Détecteur", fields:[
      // QE en fraction (τ, 0–1) et non en % — confirmé le 17/09/2026 par
      // radiometry.py : electrons = photons * QE_band, QE_band vient d'une
      // interpolation sur paramFile.Detector.QE_spectral.values, jamais
      // divisée par 100. Même convention que T (transmission optique).
      {k:"PX", label:"Largeur pixel", unit:"µm", placeholder:"obligatoire"},
      {k:"R",  label:"Bruit de lecture", unit:"e⁻", placeholder:"0 (défaut)"},
      {k:"P",  label:"PRNU", unit:"%", placeholder:"0 (défaut)"},
      {k:"K",  label:"Courant d'obscurité", unit:"e⁻/s", placeholder:"0 (défaut)"},
      {k:"FW", label:"Full well", unit:"e⁻", placeholder:"1 000 000 (défaut)"},
      {k:"QE", label:"Rendement quantique", unit:"τ", placeholder:"1 (défaut)"}
    ]},
    {id:"electronique", label:"Électronique", fields:[
      {k:"ADC",  label:"Résolution ADC", unit:"bits"}
    ]},
    {id:"wfe", label:"Performance WFE", fields:[
      {k:"W", label:"WFE RMS", unit:"nm", placeholder:"0 (défaut)"}
    ]}
  ]},
  {id:"image", kind:"ctx", label:"Image I", sub:"produit brut, n bits"},
  {id:"restitution", kind:"ctx", label:"Restitution", sub:"traitement final"}
];

var state = { active:"optique", values:{}, instrumentId:null };
// Retour automatique vers simulations.html après enregistrement, si on
// vient de là faute d'instrument existant (cf. renderInstruments dans
// simulations.html, échange du 18/09/2026) — capturé une fois au
// chargement, avant que saveToSupabase() ne réécrive l'URL avec ?id=.
var returnTarget = new URLSearchParams(window.location.search).get("return");

// persist() ne fait plus rien : l'état vit uniquement en mémoire
// (state.values) pendant l'édition — la vraie sauvegarde (Supabase)
// n'a lieu qu'au clic explicite sur "Enregistrer l'instrument"
// (cf. saveToSupabase()), pas à chaque frappe comme avec l'ancien
// brouillon localStorage. Le nom (STORAGE_KEY/NAME_KEY) a disparu avec
// le même changement.
function persist(){}

/**
 * Charge un instrument existant depuis Supabase si l'URL contient
 * ?id=<uuid> (lien "Ouvrir" depuis espace-personnel.html) ; sinon,
 * repart d'un formulaire vide (création).
 */
async function loadInstrument(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  if(!id) return;

  var { data, error } = await supabaseClient
    .from("instruments")
    .select("*")
    .eq("id", id)
    .single();

  if(error || !data){
    console.error("Erreur chargement instrument :", error);
    return; // id invalide/inaccessible — on reste sur un formulaire vide plutôt que planter
  }

  state.instrumentId = data.id;
  state.values = data.config || {};
  document.getElementById("instName").value = data.name || "";
}

function blockStatus(block){
  var filled = 0;
  block.fields.forEach(function(f){
    var v = state.values[f.k];
    if(v !== undefined && v !== null && v !== "") filled++;
  });
  if(filled === 0) return "empty";
  if(filled < block.fields.length) return "warn";
  return "ok";
}

function overallPct(){
  var total = 0, done = 0;
  SCHEMA.forEach(function(n){
    if(n.kind !== "group") return;
    n.blocks.forEach(function(b){
      total += b.fields.length;
      b.fields.forEach(function(f){
        var v = state.values[f.k];
        if(v !== undefined && v !== null && v !== "") done++;
      });
    });
  });
  return total ? Math.round(100 * done / total) : 0;
}

function statusMark(s){
  if(s === "ok") return "<span class='status ok'>✓</span>";
  if(s === "warn") return "<span class='status warn'>•</span>";
  return "<span class='status'>—</span>";
}

var chainEl = document.getElementById("chainList");
var panelEl = document.getElementById("fieldPanel");
var schemaEl = document.getElementById("schemaWrap");
var instrumentNode = SCHEMA.filter(function(n){ return n.kind === "group"; })[0];

function selectBlock(id){
  state.active = id;
  renderSchema(); renderChain(); renderPanel();
}

function renderChain(){
  chainEl.innerHTML = "";
  var list = document.createElement("div");
  list.className = "blocklist";
  instrumentNode.blocks.forEach(function(b, i){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "blockbtn" + (b.id === state.active ? " active" : "");
    btn.innerHTML = "<span class='lab'>"+(i+1)+". "+b.label+"</span>"+statusMark(blockStatus(b));
    btn.addEventListener("click", function(){ selectBlock(b.id); });
    list.appendChild(btn);
  });
  chainEl.appendChild(list);
}

// Panneau "Instrument" épuré — 4 icônes glassy (empilement de lentilles,
// détecteur, puce électronique, onde déformée pour la performance WFE)
// reliées par des flèches. Icône WFE ajoutée le 18/09/2026 — viewBox
// élargi (820→1050) pour caser les 4 sans les tasser. Les 4 blocs restent
// cliquables/configurables.
function renderSchema(){
  var act = state.active;
  function cls(id){ return "schema-block" + (id === act ? " active" : ""); }
  schemaEl.innerHTML =
  "<svg viewBox='0 0 1050 121' xmlns='http://www.w3.org/2000/svg'>"+
  "<defs>"+
    "<radialGradient id='lensGrad' cx='35%' cy='30%' r='75%'>"+
      "<stop offset='0%' stop-color='#BFF3ED'/>"+
      "<stop offset='45%' stop-color='var(--pixel)'/>"+
      "<stop offset='100%' stop-color='#0F3B3F'/>"+
    "</radialGradient>"+
    "<linearGradient id='chipGrad' x1='0' y1='0' x2='1' y2='1'>"+
      "<stop offset='0%' stop-color='var(--pixel)'/>"+
      "<stop offset='100%' stop-color='#8A6CF2'/>"+
    "</linearGradient>"+
    "<linearGradient id='icGrad' x1='0' y1='0' x2='1' y2='1'>"+
      "<stop offset='0%' stop-color='#3A5A78'/>"+
      "<stop offset='100%' stop-color='#1B2A3A'/>"+
    "</linearGradient>"+
    "<filter id='softGlow' x='-60%' y='-60%' width='220%' height='220%'>"+
      "<feGaussianBlur stdDeviation='6' result='blur'/>"+
      "<feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>"+
    "</filter>"+
  "</defs>"+

  "<rect x='2' y='5' width='1046' height='111' rx='12' fill='var(--panel)' stroke='var(--line-soft)'/>"+

  // ---- Optique : empilement de lentilles, flottant (pas de cadre) ----
  // 4 icônes centrées à 206/419/631/844 (répartition égale sur la largeur
  // utile, marges identiques à avant).
  "<g class='"+cls("optique")+"' onclick=\"selectBlock('optique')\">"+
    "<g class='schema-glow' filter='url(#softGlow)'>"+
      "<ellipse cx='184' cy='53' rx='17' ry='34' fill='url(#lensGrad)' opacity='.45'/>"+
      "<ellipse cx='206' cy='53' rx='17' ry='34' fill='url(#lensGrad)' opacity='.7'/>"+
      "<ellipse cx='228' cy='53' rx='17' ry='34' fill='url(#lensGrad)'/>"+
    "</g>"+
    "<ellipse cx='184' cy='53' rx='17' ry='34' fill='none' stroke='var(--pixel)' stroke-opacity='.5'/>"+
    "<ellipse cx='206' cy='53' rx='17' ry='34' fill='none' stroke='var(--pixel)' stroke-opacity='.7'/>"+
    "<ellipse cx='228' cy='53' rx='17' ry='34' fill='none' stroke='var(--pixel)'/>"+
    "<text x='206' y='101' text-anchor='middle' class='schema-blocklabel'>Optique</text>"+
  "</g>"+

    var v = state.values[f.k] !== undefined ? state.values[f.k] : "";
    var valueAttr = v !== "" ? " value='"+v+"'" : "";
    // ESUP : obligatoire seulement si des supports sont renseignés

    // chaud", "Cas froid") avec leurs coefficients de Zernike complets,
    // chargés par fichier — choisis au lancement, dans Conditions
    // d'acquisition (cf. simulations.html), pas ici.
    if(f.k === "W") fieldsHtml += renderWfeCasesHtml();

    if(f.k === "QE") fieldsHtml += renderQeSpectralHtml();

  // Blocs Optique et Détecteur : mise en page 2 colonnes (schéma à

          viewLabel+
        "</div>"+
      "</div>"+
      "<div class='optique-fields-col'>"+fieldsHtml+"</div>"+
    "</div>";
  } else {
    html += fieldsHtml;
  }

  block.fields.forEach(function(f){
    document.getElementById("f-"+f.k).addEventListener("input", function(e){
      state.values[f.k] = e.target.value;
      persist();
      updateProgress();
      renderChain(); // met à jour le statut ✓/!/○ du bloc en cours de saisie
      if(block.id === "optique") renderOpticsGeometry(); // aperçu géométrique en direct
      if(block.id === "detecteur") renderDetectorGeometry();
      // NSUP change : le placeholder d'ESUP ("obligatoire" ou "0 (défaut)")

      // qu'avec un renderPanel() complet, pour ne pas perdre le focus en
      // cours de frappe sur NSUP.
      if(f.k === "NSUP"){
        var esupEl = document.getElementById("f-ESUP");
        if(esupEl) esupEl.placeholder = (Number(state.values.NSUP) > 0) ? "obligatoire" : "0 (défaut)";
      }
      // renderChain() reconstruit les boutons : on garde le focus sur le bon champ
      var el = document.getElementById("f-"+f.k);
      if(el) { el.focus(); var pos = e.target.value.length; el.setSelectionRange && el.setSelectionRange(pos,pos); }
    });
  });
  if(block.id === "optique") renderOpticsGeometry();
  if(block.id === "detecteur") { renderDetectorGeometry(); wireQeSpectralUI(); }
  if(block.id === "wfe") wireWfeCasesUI();
  var actions = document.createElement("div");
  actions.className = "panel-actions";
  // Bouton "Suivant" : avance au bloc suivant de la chaîne (Optique →
  // Détecteur → Électronique → Performance WFE) — absent sur le dernier
  // bloc, rien après.
  var blockIdx = instrumentNode.blocks.indexOf(block);
  var nextBlock = instrumentNode.blocks[blockIdx + 1];
  var nextBtnHtml = nextBlock
    ? "<button class='btn next' type='button' id='btnNext'>Suivant : "+nextBlock.label+"</button>"
    : "";
  actions.innerHTML = "<button class='btn ghost' type='button' id='btnReset'>Réinitialiser ce bloc</button>"+
    "<div class='rightbtns'>"+nextBtnHtml+
    "<button class='btn primary' type='button' id='btnSave'>Enregistrer l'instrument</button></div>";
  panelEl.appendChild(actions);
  document.getElementById("btnReset").addEventListener("click", function(){
    block.fields.forEach(function(f){ delete state.values[f.k]; });
    persist(); updateProgress(); renderChain(); renderPanel();
  });
  if(nextBlock){
    document.getElementById("btnNext").addEventListener("click", function(){ selectBlock(nextBlock.id); });
  }
  document.getElementById("btnSave").addEventListener("click", saveToSupabase);
}

//   RMS  : {id, name, mode:"rms", rms}

//           rowCount, align, convention}
// Un instrument peut porter plusieurs cas (thermique chaud/froid, etc.) ;
// c'est au lancement de la simulation que l'un d'eux est choisi (ou aucun,

// (cf. simulations.html : sélectionner un cas RMS au lancement remplace

//
// Format CSV attendu pour un cas "file" — même format que
// module_MTF.load_zernike_csv côté backend : séparateur ";", décimales

// ===================== Détail Zernike par colonne =====================
// Le CSV d'un cas WFE (cf. ci-dessus) est une ligne par couple
// (Detector_ID, Band, Column) — chaque ligne porte 37 coefficients de
// Zernike (Z1..Z37). Ajouté le 18/09/2026 : parse le CSV côté site pour
// afficher, pour une colonne choisie, le détail de ses 37 coefficients et
// leur somme — jusqu'ici le CSV n'était que transmis brut, jamais
// affiché.
function parsePerfoCsvRows(text){
  if(!text) return [];
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(lines.length < 2) return [];
  var header = lines[0].split(";").map(function(h){ return h.trim(); });
  var detIdx = header.indexOf("Detector_ID"), bandIdx = header.indexOf("Band"), colIdx = header.indexOf("Column");
  var zIdx = [];
  for(var i = 1; i <= 37; i++) zIdx.push(header.indexOf("Z"+i));
  var rows = [];
  for(var r = 1; r < lines.length; r++){
    var cells = lines[r].split(";");
    if(cells.length < header.length) continue;
    var z = zIdx.map(function(idx){
      if(idx < 0 || idx >= cells.length) return 0;
      var v = parseFloat((cells[idx] || "").trim().replace(",", "."));
      return isNaN(v) ? 0 : v;
    });
    rows.push({
      detector: detIdx >= 0 ? (cells[detIdx] || "").trim() : "",
      band: bandIdx >= 0 ? (cells[bandIdx] || "").trim() : "",
      column: colIdx >= 0 ? (cells[colIdx] || "").trim() : String(r),
      z: z
    });
  }
  return rows;
}

function renderZernikeDetailHtml(cases){
  var fileCases = cases.filter(function(c){ return c.mode === "file"; });
  return "<div class='wfecases zdetail'>"+
    "<div class='wfehead'><label>Détail Zernike</label></div>"+
    "<p class='wfesub'>Front d'onde combiné (fausses couleurs) d'une colonne donnée, pour un cas WFE fichier chargé ci-dessus.</p>"+
    (fileCases.length
      ? "<div class='zpickrow'>"+
          "<select id='zernCaseSel'>"+fileCases.map(function(c){ return "<option value='"+c.id+"'>"+c.name+"</option>"; }).join("")+"</select>"+
          "<select id='zernColSel'></select>"+
        "</div>"+
        "<div id='zernOut'></div>"
      : "<p class='empty'>Charge un cas WFE « fichier » ci-dessus pour voir le détail (un cas RMS n'a pas de coefficients détaillés).</p>")+
  "</div>";
}

// ---- Maths Zernike (base orthonormée), convention paramétrable ----
// Donnée par cas WFE (cf. select "convention" dans renderWfeCasesHtml),
// pas supposée fixe pour tout le monde — deux conventions supportées :
// OSA/ANSI (Z1..Z37 du fichier = indices OSA 0..36) et Noll (Z1..Z37 =
// indices Noll 1..37 directement). Chacune donne un (n,m) — donc une
// forme de carte et des noms de modes — DIFFÉRENTS pour les mêmes valeurs
// brutes. N'affecte que cet aperçu, jamais le CSV envoyé au serveur.
var ZERNIKE_NAMES_OSA = {
  1:"piston", 2:"tilt (Y)", 3:"tilt (X)", 4:"astigmatisme oblique",
  5:"défocalisation", 6:"astigmatisme", 7:"trefoil oblique", 8:"coma (Y)",
  9:"coma (X)", 10:"trefoil", 11:"tétrafoil oblique", 12:"astigmatisme secondaire",
  13:"sphérique", 14:"astigmatisme secondaire", 15:"tétrafoil"
};
var ZERNIKE_NAMES_NOLL = {
  1:"piston", 2:"tilt (X)", 3:"tilt (Y)", 4:"défocalisation",
  5:"astigmatisme oblique", 6:"astigmatisme", 7:"coma (Y)", 8:"coma (X)",
  9:"trefoil oblique", 10:"trefoil", 11:"sphérique", 12:"astigmatisme secondaire",
  13:"astigmatisme secondaire", 14:"tétrafoil", 15:"tétrafoil"
};
// Vérifiée point par point (piston, tilt X/Y, defocus, astigmatismes,
// coma X/Y, sphérique en position 9, trefoil X/Y en 10/11 — la
// particularité connue de Fringe qui place le sphérique AVANT le trefoil,
// contrairement à OSA/Noll) avant intégration.
var ZERNIKE_NAMES_FRINGE = {
  1:"piston", 2:"tilt (X)", 3:"tilt (Y)", 4:"défocalisation",
  5:"astigmatisme", 6:"astigmatisme oblique", 7:"coma (X)", 8:"coma (Y)",
  9:"sphérique", 10:"trefoil", 11:"trefoil oblique", 12:"astigmatisme secondaire",
  13:"astigmatisme secondaire", 14:"coma secondaire", 15:"coma secondaire"
};
function zernikeName(k, convention){
  var table = convention === "noll" ? ZERNIKE_NAMES_NOLL
    : convention === "fringe" ? ZERNIKE_NAMES_FRINGE
    : ZERNIKE_NAMES_OSA;
  return table[k] || null;
}
function zFactorial(n){ var r = 1; for(var i = 2; i <= n; i++) r *= i; return r; }
function zOsaNM(j){ // j : indice OSA 0-indexé
  var n = Math.ceil((-3 + Math.sqrt(9 + 8*j)) / 2);
  var m = 2*j - n*(n+2);
  return { n: n, m: m };
}
// Vérifié point par point contre les modes connus (j=1..8 : piston, tip,
// tilt, defocus, astigmatismes, coma Y/X — tous corrects) avant intégration.
function zNollNM(j){ // j : indice Noll 1-indexé
  var n = 0, j1 = j - 1;
  while(j1 > n){ n++; j1 -= n; }
  var m = Math.pow(-1, j) * ((n % 2) + 2 * Math.floor((j1 + ((n+1) % 2)) / 2));
  return { n: n, m: m };
}
// Convention Fringe (Univ. Arizona) — groupée par p=(n+|m|)/2, chaque
// groupe p comptant 2p+1 termes (cumul = (p+1)²), ordonnés à l'intérieur
// du groupe par |m| DÉCROISSANT (+m puis -m), m=0 en dernier. Vérifiée
// point par point (piston..trefoil, sphérique en position 9) avant
// intégration.
function zFringeNM(k){ // k : indice Fringe 1-indexé
  var p = 0;
  while((p+1)*(p+1) < k) p++;
  var pos = k - p*p, m;
  if(pos === 2*p+1){ m = 0; }
  else {
    var idx = pos - 1, absM = p - Math.floor(idx/2);
    m = (idx % 2 === 0 ? 1 : -1) * absM;
  }
  return { n: 2*p - Math.abs(m), m: m };
}
function zNM(k, convention){ // k : indice 1-indexé tel que dans le fichier (Zk)
  if(convention === "noll") return zNollNM(k);
  if(convention === "fringe") return zFringeNM(k);
  return zOsaNM(k-1);
}
function zRadial(n, m, rho){
  m = Math.abs(m);
  var sum = 0;
  for(var k = 0; k <= (n-m)/2; k++){
    var c = (k % 2 === 0 ? 1 : -1) * zFactorial(n-k) /
      (zFactorial(k) * zFactorial((n+m)/2-k) * zFactorial((n-m)/2-k));
    sum += c * Math.pow(rho, n-2*k);
  }
  return sum;
}
function zValue(k, convention, rho, theta){ // k : indice 1-indexé du fichier (Zk), base orthonormée
  var nm = zNM(k, convention), n = nm.n, m = nm.m;
  var R = zRadial(n, m, rho);
  var norm = m === 0 ? Math.sqrt(n+1) : Math.sqrt(2*(n+1));
  if(m > 0) return norm * R * Math.cos(m*theta);
  if(m < 0) return norm * R * Math.sin(-m*theta);
  return norm * R;
}
function zJetColor(t){
  var stops = [[10,20,110],[10,80,220],[40,200,220],[230,230,60],[220,60,30],[130,10,10]];
  var pos = Math.max(0, Math.min(1, t)) * (stops.length-1);
  var i = Math.min(stops.length-2, Math.floor(pos));
  var f = pos - i, c0 = stops[i], c1 = stops[i+1];
  return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
}
// Trace la carte du front d'onde combiné (somme pondérée des 37 modes) sur
// un canvas carré, masqué au disque unité. Retourne {pv, rms} — RMS calculé
// analytiquement (base orthonormée ⇒ RMS = norme des coefficients, piston
// exclu, indépendant de la convention), P-V lu sur la grille échantillonnée
// (pas de formule fermée) — la FORME de la carte, elle, dépend de convention.
function drawWavefrontMap(canvas, coeffs, convention){
  var size = canvas.width;
  var ctx = canvas.getContext("2d");
  var img = ctx.createImageData(size, size);
  var R = size/2 - 1, cx = size/2, cy = size/2;
  var vals = new Float32Array(size*size);
  var vmin = Infinity, vmax = -Infinity;
  for(var y = 0; y < size; y++){
    for(var x = 0; x < size; x++){
      var dx = (x-cx)/R, dy = (y-cy)/R, rho = Math.sqrt(dx*dx+dy*dy);
      var idx = y*size+x;
      if(rho > 1){ vals[idx] = NaN; continue; }
      var theta = Math.atan2(dy, dx), w = 0;
      for(var k = 1; k <= coeffs.length; k++){
        if(coeffs[k-1]) w += coeffs[k-1] * zValue(k, convention, rho, theta);
      }
      vals[idx] = w;
      if(w < vmin) vmin = w;
      if(w > vmax) vmax = w;
    }
  }
  var span = (vmax - vmin) || 1;
  for(var i = 0; i < size*size; i++){
    var v = vals[i], p = i*4;
    if(isNaN(v)){ img.data[p+3] = 0; continue; }
    var c = zJetColor((v-vmin)/span);
    img.data[p] = c[0]; img.data[p+1] = c[1]; img.data[p+2] = c[2]; img.data[p+3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  var rmsSum = 0;
  for(var k2 = 1; k2 < coeffs.length; k2++) rmsSum += coeffs[k2]*coeffs[k2]; // exclut le piston (indice 0)
  return { pv: vmax - vmin, rms: Math.sqrt(rmsSum) };
}

function renderZernikeDetail(){
  var caseSel = document.getElementById("zernCaseSel");
  var colSel = document.getElementById("zernColSel");
  var out = document.getElementById("zernOut");
  if(!caseSel) return; // aucun cas WFE — rien à afficher

  var cases = state.values.wfeCases || [];
  var selectedCase = cases.find(function(c){ return c.id === caseSel.value; }) || cases[0];
  if(!selectedCase){ out.innerHTML = ""; return; }

  var rows = parsePerfoCsvRows(selectedCase.csv);
  var prevCol = colSel.value;
  colSel.innerHTML = rows.map(function(r, i){
    return "<option value='"+i+"'>"+(r.band ? "Bande "+r.band+" — " : "")+"Colonne "+r.column+"</option>";
  }).join("") || "<option value=''>—</option>";
  if(rows.some(function(r, i){ return String(i) === prevCol; })) colSel.value = prevCol;

  var idx = Number(colSel.value) || 0;
  var row = rows[idx];
  if(!row){
    out.innerHTML = "<p class='empty'>CSV illisible ou vide.</p>";
    return;
  }
  var convention = selectedCase.convention || "osa";

  // Les 5 modes dominants (hors piston), pour l'affichage façon "termes
  // nommés" — comme sur la référence partagée (spherical+defocus, etc.),
  // sans essayer de reproduire sa décomposition en 2 sous-cartes (choix
  // illustratif propre à cet exemple, pas un calcul déterministe).
  var ranked = row.z.map(function(v, i){ return { k: i+1, v: v }; })
    .filter(function(e){ return e.k !== 1; })
    .sort(function(a, b){ return Math.abs(b.v) - Math.abs(a.v); })
    .slice(0, 5);
  var termsHtml = ranked.map(function(e){
    var nm = zernikeName(e.k, convention);
    var name = nm ? " ("+nm+")" : "";
    return "<div class='zterm'><span class='zk'>Z"+e.k+name+"</span><span class='zv'>"+e.v.toFixed(4)+"</span></div>";
  }).join("");

  out.innerHTML =
    "<div class='zmapwrap'>"+
      "<canvas id='zernCanvas' width='150' height='150' class='zcanvas'></canvas>"+
      "<div class='zmapstats' id='zmapStats'></div>"+
    "</div>"+
    "<div class='zterms'>"+termsHtml+"</div>";

  var canvas = document.getElementById("zernCanvas");
  var stats = drawWavefrontMap(canvas, row.z, convention);
  document.getElementById("zmapStats").innerHTML =
    "P-V : <b>"+stats.pv.toFixed(3)+" nm</b><br>RMS : <b>"+stats.rms.toFixed(3)+" nm</b>";
}

// Validation légère — on ne parse pas vraiment le CSV (le serveur le fait
// avec pandas/le vrai séparateur), on vérifie juste que l'en-tête a la
// bonne forme pour attraper un fichier évidemment mauvais avant l'envoi.
function validateWfeCsv(text){
  var firstLine = (text.split(/\r?\n/)[0] || "").trim();
  var cols = firstLine.split(";").map(function(c){ return c.trim(); });
  var hasCore = cols.indexOf("Detector_ID") >= 0 && cols.indexOf("Band") >= 0 && cols.indexOf("Column") >= 0;
  var hasZ = cols.indexOf("Z1") >= 0;
  if(!hasCore || !hasZ) return null;
  var rowCount = text.split(/\r?\n/).filter(function(l){ return l.trim(); }).length - 1;
  return { rowCount: Math.max(rowCount, 0) };
}

function wireWfeCasesUI(){
  var addRmsBtn = document.getElementById("btnAddWfeRms");
  var addFileBtn = document.getElementById("btnAddWfeFile");
  var fileInput = document.getElementById("wfeCaseFileInput");
  if(!addRmsBtn || !addFileBtn || !fileInput) return;

  addRmsBtn.addEventListener("click", function(){
    var name = prompt("Nom du cas WFE (ex. « Cas chaud », « Cas froid en orbite ») :");
    if(name === null || !name.trim()) return;
    var rmsStr = prompt("WFE RMS pour ce cas (nm) :");
    if(rmsStr === null) return;
    var rms = Number(String(rmsStr).replace(",", "."));
    if(isNaN(rms)){ alert("Valeur RMS invalide."); return; }
    if(!state.values.wfeCases) state.values.wfeCases = [];
    state.values.wfeCases.push({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
      name: name.trim(),
      mode: "rms",
      rms: rms
    });
    persist();
    renderPanel();
  });

  var pendingName = null;

  addFileBtn.addEventListener("click", function(){
    var name = prompt("Nom du cas WFE (ex. « Cas chaud », « Cas froid en orbite ») :");
    if(name === null || !name.trim()) return;
    pendingName = name.trim();
    fileInput.value = "";
    fileInput.click();
  });

  fileInput.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file || !pendingName) return;
    var reader = new FileReader();
    reader.onload = function(){
      var meta = validateWfeCsv(reader.result);
      if(!meta){
        alert("Fichier illisible : CSV attendu au format \"Detector_ID;Band;Column;Z1;...;Z37\" (séparateur point-virgule).");
        return;
      }
      if(!state.values.wfeCases) state.values.wfeCases = [];
      state.values.wfeCases.push({
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
        name: pendingName,
        mode: "file",
        filename: file.name,
        csv: reader.result,
        rowCount: meta.rowCount,
        align: "center",
        convention: "osa"
      });
      pendingName = null;
      persist();
      renderPanel();
    };
    reader.readAsText(file);
  });

  panelEl.querySelectorAll("[data-align-case]").forEach(function(sel){
    sel.addEventListener("change", function(){
      var id = sel.dataset.alignCase;
      var c = (state.values.wfeCases || []).find(function(x){ return x.id === id; });
      if(c){ c.align = sel.value; persist(); }
      // pas de renderPanel() ici : re-générer tout le panneau ferait perdre
      // le focus du <select> qu'on vient d'utiliser, pour un changement qui
      // n'affecte aucun autre affichage visible dans cette vue.
    });
  });

  panelEl.querySelectorAll("[data-conv-case]").forEach(function(sel){
    sel.addEventListener("change", function(){
      var id = sel.dataset.convCase;
      var c = (state.values.wfeCases || []).find(function(x){ return x.id === id; });
      if(c){ c.convention = sel.value; persist(); renderZernikeDetail(); }
    });
  });

  panelEl.querySelectorAll("[data-del-case]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.dataset.delCase;
      state.values.wfeCases = (state.values.wfeCases || []).filter(function(c){ return c.id !== id; });
      persist();
      renderPanel();
    });
  });

  var zernCaseSel = document.getElementById("zernCaseSel");
  var zernColSel = document.getElementById("zernColSel");
  if(zernCaseSel && zernColSel){
    renderZernikeDetail();
    zernCaseSel.addEventListener("change", renderZernikeDetail);
    zernColSel.addEventListener("change", renderZernikeDetail);
  }
}

// ===================== Aperçu géométrique du plan pupille =====================
// Cercle extérieur = diamètre de pupille (D), cercle intérieur = obscuration
// centrale (E, même convention que les presets existants : un diamètre, pas
// un rayon — cf. presets.js, ex. Pléiades Neo D:0.91/E:0.3185), traits
// radiaux = supports du secondaire (NSUP compte, ESUP épaisseur), tracés à
// l'échelle réelle des données (épaisseur des supports proportionnelle à D,
// comme un vrai tracé matplotlib/MATLAB). Mis à jour en direct à chaque
// frappe sur D/E/NSUP/ESUP (cf. l'appel dans le listener "input" de
// renderPanel). Grille décorative en fond (appréciée telle quelle) +
// cotes de plan CAD (D, d, supports) pour les valeurs — pas d'axes X/Y
// gradués, retirés le 18/09/2026 ("les axes ne sont pas bien").
function renderOpticsGeometry(){
  var host = document.getElementById("opticsGeoSvg");
  if(!host) return;
  var D = Number(state.values.D) || 0;
  var E = Number(state.values.E) || 0;
  var n = Math.max(0, Math.round(Number(state.values.NSUP) || 0));
  var t = Number(state.values.ESUP) || 0;

  var cx = 210, cy = 155, R = 105; // rayon à l'écran (px) représentant D
  var rObsc = D > 0 ? R * Math.min(E / D, 0.92) : 0;
  var strokeW = D > 0 && t > 0 ? Math.max(1.2, (t / D) * R) : 1.5;

  // ---- Grille décorative (texture de fond, non graduée) ----
  var gridStep = 40;
  var grid = "<g stroke='var(--line-soft)' stroke-width='1'>";
  for(var gx = 20; gx <= 420; gx += gridStep) grid += "<line x1='"+gx+"' y1='0' x2='"+gx+"' y2='310'/>";
  for(var gy = 15; gy <= 295; gy += gridStep) grid += "<line x1='0' y1='"+gy+"' x2='440' y2='"+gy+"'/>";
  grid += "</g>";

  var struts = "";
  for(var i = 0; i < n; i++){
    var angle = (2 * Math.PI * i) / n - Math.PI / 2;
    var x1 = cx + rObsc * Math.cos(angle), y1 = cy + rObsc * Math.sin(angle);
    var x2 = cx + R * Math.cos(angle), y2 = cy + R * Math.sin(angle);
    struts += "<line x1='"+x1.toFixed(1)+"' y1='"+y1.toFixed(1)+"' x2='"+x2.toFixed(1)+"' y2='"+y2.toFixed(1)+
      "' stroke='var(--muted)' stroke-width='"+strokeW.toFixed(1)+"' stroke-linecap='round'/>";
  }

  // ---- Cotation du diamètre D, ligne horizontale sous le cercle ----
  var dimY = cy + R + 34;
  var xL = cx - R, xR = cx + R;
  var dimD =
    "<g stroke='var(--muted-2)' stroke-width='1'>"+
      "<line x1='"+xL+"' y1='"+(cy+4)+"' x2='"+xL+"' y2='"+dimY+"'/>"+
      "<line x1='"+xR+"' y1='"+(cy+4)+"' x2='"+xR+"' y2='"+dimY+"'/>"+
      "<line x1='"+xL+"' y1='"+dimY+"' x2='"+xR+"' y2='"+dimY+"'/>"+
    "</g>"+
    "<path d='M"+xL+","+dimY+" l8,-3.5 v7 z' fill='var(--muted-2)'/>"+
    "<path d='M"+xR+","+dimY+" l-8,-3.5 v7 z' fill='var(--muted-2)'/>"+
    "<text x='"+cx+"' y='"+(dimY-7)+"' text-anchor='middle' class='geo-dim'>D = "+(D || "—")+" m</text>";

  // ---- Appel de cote pour l'obscuration centrale, en diagonale ----
  var obscLabel = "";
  if(rObsc > 0){
    var a1 = -40 * Math.PI / 180;
    var lx1 = cx + rObsc * Math.cos(a1), ly1 = cy + rObsc * Math.sin(a1);
    var lx2 = cx + R + 34, ly2 = cy - R + 6;
    obscLabel =
      "<circle cx='"+lx1.toFixed(1)+"' cy='"+ly1.toFixed(1)+"' r='2' fill='var(--muted-2)'/>"+
      "<path d='M"+lx1.toFixed(1)+","+ly1.toFixed(1)+" L"+lx2+","+ly2+" h14' fill='none' stroke='var(--muted-2)' stroke-width='1'/>"+
      "<text x='"+(lx2+18)+"' y='"+(ly2+4)+"' class='geo-dim'>d = "+(E || 0)+" m</text>";
  }

  // ---- Appel de cote pour les supports, en diagonale basse ----
  var supLabel = "";
  if(n > 0){
    var a2 = 145 * Math.PI / 180;
    var mx1 = cx + R * 0.62 * Math.cos(a2), my1 = cy + R * 0.62 * Math.sin(a2);
    var mx2 = cx - R - 15, my2 = cy + R + 6;
    supLabel =
      "<circle cx='"+mx1.toFixed(1)+"' cy='"+my1.toFixed(1)+"' r='2' fill='var(--muted-2)'/>"+
      "<path d='M"+mx1.toFixed(1)+","+my1.toFixed(1)+" L"+mx2+","+my2+" h-14' fill='none' stroke='var(--muted-2)' stroke-width='1'/>"+
      "<text x='"+(mx2-18)+"' y='"+(my2+4)+"' text-anchor='end' class='geo-dim'>"+n+" × "+(t || 0)+" m</text>";
  }

  host.innerHTML =
    "<svg viewBox='0 0 440 310' preserveAspectRatio='xMidYMid meet' style='width:100%;height:100%;display:block'>"+
      "<rect x='0' y='0' width='440' height='310' fill='var(--void)'/>"+
      grid+
      "<circle cx='"+cx+"' cy='"+cy+"' r='"+R+"' fill='var(--void)' stroke='var(--pixel)' stroke-width='1.6'/>"+
      struts+
      (rObsc > 0 ? "<circle cx='"+cx+"' cy='"+cy+"' r='"+rObsc.toFixed(1)+"' fill='var(--panel)' stroke='var(--line)' stroke-width='1.2'/>" : "")+
      dimD + obscLabel + supLabel +
    "</svg>";
}

// ===================== Aperçu géométrique du détecteur (coupe, vue de côté) =====================
// Ajouté le 18/09/2026 — même esprit que renderOpticsGeometry (grille
// décorative + cote CAD), mais en coupe : rangée de pixels posée sur un
// substrat, lumière incidente en haut, cote sur la largeur de pixel (PX,
// µm — pas en mètres comme l'optique). Purement visuel : PX est le seul
// paramètre réellement utilisé ici, R/P/K/FW/QE ne changent rien au dessin
// (ce ne sont pas des grandeurs géométriques).
function renderDetectorGeometry(){
  var host = document.getElementById("detectorGeoSvg");
  if(!host) return;
  var PX = Number(state.values.PX) || 0;

  var cx = 220, pxSize = 36, nPix = 6;
  var rowW = pxSize * nPix, xStart = cx - rowW / 2;
  var subTop = 180, subH = 36, pixTop = subTop - 32;

  // ---- Grille décorative (même texture que le plan pupille) ----
  var gridStep = 40;
  var grid = "<g stroke='var(--line-soft)' stroke-width='1'>";
  for(var gx = 20; gx <= 420; gx += gridStep) grid += "<line x1='"+gx+"' y1='0' x2='"+gx+"' y2='310'/>";
  for(var gy = 15; gy <= 295; gy += gridStep) grid += "<line x1='0' y1='"+gy+"' x2='440' y2='"+gy+"'/>";
  grid += "</g>";

  // ---- Substrat ----
  var substrate = "<rect x='"+(xStart-4)+"' y='"+subTop+"' width='"+(rowW+8)+"' height='"+subH+"' rx='3' "+
    "fill='var(--panel-2)' stroke='var(--line)' stroke-width='1.2'/>";

  // ---- Pixels (carrés jointifs sur le substrat) ----
  var pixels = "";
  for(var i = 0; i < nPix; i++){
    var px = xStart + i * pxSize;
    pixels += "<rect x='"+px+"' y='"+pixTop+"' width='"+pxSize+"' height='32' "+
      "fill='url(#chipGrad2)' fill-opacity='.5' stroke='var(--pixel)' stroke-opacity='.6' stroke-width='1'/>";
  }

  // ---- Lumière incidente (flèches vers le bas) ----
  var light = "<g stroke='var(--photon)' stroke-width='1.6' stroke-linecap='round'>";
  for(var lx = xStart + pxSize*0.5; lx <= xStart + rowW; lx += pxSize){
    light += "<line x1='"+lx+"' y1='108' x2='"+lx+"' y2='"+(pixTop-6)+"'/>"+
      "<path d='M"+lx+","+(pixTop-6)+" l-4,-7 h8 z' fill='var(--photon)' stroke='none'/>";
  }
  light += "</g>"+
    "<text x='"+cx+"' y='98' text-anchor='middle' class='geo-dim'>Lumière incidente</text>";

  // ---- Cotation de la largeur d'un pixel (le 4e, à peu près centré) ----
  var dimIdx = Math.floor(nPix / 2);
  var dxL = xStart + dimIdx * pxSize, dxR = dxL + pxSize;
  var dimY = subTop + subH + 34;
  var dimPx =
    "<g stroke='var(--muted-2)' stroke-width='1'>"+
      "<line x1='"+dxL+"' y1='"+(subTop+subH+4)+"' x2='"+dxL+"' y2='"+dimY+"'/>"+
      "<line x1='"+dxR+"' y1='"+(subTop+subH+4)+"' x2='"+dxR+"' y2='"+dimY+"'/>"+
      "<line x1='"+dxL+"' y1='"+dimY+"' x2='"+dxR+"' y2='"+dimY+"'/>"+
    "</g>"+
    "<path d='M"+dxL+","+dimY+" l8,-3.5 v7 z' fill='var(--muted-2)'/>"+
    "<path d='M"+dxR+","+dimY+" l-8,-3.5 v7 z' fill='var(--muted-2)'/>"+
    "<text x='"+((dxL+dxR)/2)+"' y='"+(dimY-7)+"' text-anchor='middle' class='geo-dim'>PX = "+(PX || "—")+" µm</text>";

  host.innerHTML =
    "<svg viewBox='0 0 440 310' preserveAspectRatio='xMidYMid meet' style='width:100%;height:100%;display:block'>"+
      "<defs><linearGradient id='chipGrad2' x1='0' y1='0' x2='1' y2='1'>"+
        "<stop offset='0%' stop-color='var(--pixel)'/><stop offset='100%' stop-color='#8A6CF2'/>"+
      "</linearGradient></defs>"+
      "<rect x='0' y='0' width='440' height='310' fill='var(--void)'/>"+
      grid+
      light+
      substrate+
      pixels+
      dimPx+
    "</svg>";
}

// ===================== QE spectral (courbe QE(λ) point par point) =====================
// Stockée dans state.values.qeSpectral : [{wl, qe}, ...] (wl en nm, qe en
// FRACTION 0-1 — confirmé le 17/09/2026 via radiometry.py, cf. commentaire
// sur le champ QE scalaire ci-dessus). Optionnelle — coexiste avec le QE
// scalaire ci-dessus (mode simplifié, utilisé si la courbe est vide).
// Envoyée au lancement de la simulation (cf. simulations.html, payload.qeSpectral)
// sous la forme paramFile.Detector.QE_spectral = {wavelength_nm:[...], values:[...]}
// attendue par radiometry._integrate_radiance_to_electrons — remplace alors
// la version synthétisée à plat depuis le QE scalaire.
function renderQeSpectralHtml(){
  var pts = state.values.qeSpectral || [];
  var rows = pts.map(function(p, i){
    return "<div class='qerow' data-qe-idx='"+i+"'>"+
      "<input type='number' step='any' class='qewl' data-qe-idx='"+i+"' value='"+p.wl+"' placeholder='λ (nm)'>"+
      "<input type='number' step='any' class='qeval' data-qe-idx='"+i+"' value='"+p.qe+"' placeholder='QE (0-1)'>"+
      "<button type='button' class='qedel' data-qe-del='"+i+"' aria-label='Supprimer ce point'>×</button>"+
    "</div>";
  }).join("");
  return "<div class='wfecases qespectral'>"+
    "<div class='wfehead'><label>QE spectral (optionnel)</label>"+
    "<button type='button' class='addcasebtn' id='btnAddQePoint'>+ Ajouter un point</button></div>"+
    "<p class='wfesub'>Un point par longueur d'onde, QE en fraction (0-1, pas en %) — remplace le QE scalaire ci-dessus si renseigné.</p>"+
    "<div id='qeRows'>"+(pts.length ? rows : "<p class='empty'>Aucun point défini.</p>")+"</div>"+
    "<div id='qeChart'></div>"+
  "</div>";
}

function renderQeChart(){
  var host = document.getElementById("qeChart");
  if(!host) return;
  var pts = (state.values.qeSpectral || [])
    .filter(function(p){ return p.wl !== "" && p.qe !== "" && !isNaN(p.wl) && !isNaN(p.qe); })
    .map(function(p){ return { wl: Number(p.wl), qe: Number(p.qe) }; })
    .sort(function(a,b){ return a.wl - b.wl; });
  if(pts.length < 2){
    host.innerHTML = "<p class='empty' style='margin-top:8px'>Au moins 2 points valides pour afficher la courbe.</p>";
    return;
  }
  var W = 400, H = 140, padL = 34, padR = 10, padT = 10, padB = 22;
  var wlMin = pts[0].wl, wlMax = pts[pts.length-1].wl;
  var qeMin = Math.min(0, Math.min.apply(null, pts.map(function(p){ return p.qe; })));
  var qeMax = Math.max.apply(null, pts.map(function(p){ return p.qe; })) * 1.1 || 1;
  var wlSpan = (wlMax - wlMin) || 1, qeSpan = (qeMax - qeMin) || 1;
  function x(wl){ return padL + (wl - wlMin) / wlSpan * (W - padL - padR); }
  function y(qe){ return H - padB - (qe - qeMin) / qeSpan * (H - padT - padB); }
  var pathD = pts.map(function(p, i){ return (i===0?"M":"L") + x(p.wl).toFixed(1) + "," + y(p.qe).toFixed(1); }).join(" ");
  var dots = pts.map(function(p){
    return "<circle cx='"+x(p.wl).toFixed(1)+"' cy='"+y(p.qe).toFixed(1)+"' r='3' fill='var(--pixel)'/>";
  }).join("");
  host.innerHTML =
    "<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;height:auto;display:block;margin-top:10px'>"+
      "<line x1='"+padL+"' y1='"+(H-padB)+"' x2='"+(W-padR)+"' y2='"+(H-padB)+"' stroke='var(--line-soft)'/>"+
      "<line x1='"+padL+"' y1='"+padT+"' x2='"+padL+"' y2='"+(H-padB)+"' stroke='var(--line-soft)'/>"+
      "<text x='"+padL+"' y='"+(H-4)+"' font-family='var(--mono)' font-size='9' fill='var(--muted-2)'>"+wlMin+" nm</text>"+
      "<text x='"+(W-padR)+"' y='"+(H-4)+"' text-anchor='end' font-family='var(--mono)' font-size='9' fill='var(--muted-2)'>"+wlMax+" nm</text>"+
      "<path d='"+pathD+"' fill='none' stroke='var(--pixel)' stroke-width='2'/>"+
      dots+
    "</svg>";
}

function wireQeSpectralUI(){
  renderQeChart();

/**
 * Sauvegarde réelle dans Supabase — insertion si c'est un nouvel
 * instrument (state.instrumentId encore vide), mise à jour sinon.
 * Le nom est requis : impossible de sauvegarder un instrument sans nom
 * (il deviendrait illisible dans la liste "Mes instruments").
 *
 * Limite de 20 instruments par compte — appliquée côté base (trigger
 * Postgres "check_instrument_limit" sur la table "instruments", pas ici)
 * pour ne pas pouvoir être contournée en modifiant juste le front. Rien à
 * faire ici pour ça, sauf afficher le message d'erreur qui en revient
 * (cf. plus bas). Migration SQL nécessaire si le trigger n'existe pas
 * encore :
 *
 *   create or replace function check_instrument_limit()
 *   returns trigger as $$
 *   begin
 *     if (select count(*) from instruments where account_id = new.account_id) >= 20 then
 *       raise exception 'Limite de 20 instruments atteinte. Supprimez-en un pour en créer un nouveau.';
 *     end if;
 *     return new;
 *   end;
 *   $$ language plpgsql;
 *
 *   drop trigger if exists trg_check_instrument_limit on instruments;
 *   create trigger trg_check_instrument_limit
 *     before insert on instruments
 *     for each row execute function check_instrument_limit();
 */
async function saveToSupabase(){
  var btn = document.getElementById("btnSave");
  var name = document.getElementById("instName").value.trim();

  var oldHint = panelEl.querySelector(".savehint");
  if(oldHint) oldHint.remove();

  if(!name){
    var errHint = document.createElement("p");
    errHint.className = "savehint";
    errHint.style.color = "var(--alert)";
    errHint.textContent = "Donne un nom à l'instrument avant de l'enregistrer.";
    panelEl.appendChild(errHint);
    document.getElementById("instName").focus();
    return;
  }

  btn.disabled = true;
  var hint = document.createElement("p");
  hint.className = "savehint";
  hint.textContent = "Enregistrement…";
  panelEl.appendChild(hint);

  var session = await requireAuth();
  if(!session) return; // requireAuth a déjà redirigé vers login.html

  var row = { name: name, config: state.values, updated_at: new Date().toISOString() };

  var result;
  if(state.instrumentId){
    result = await supabaseClient
      .from("instruments")
      .update(row)
      .eq("id", state.instrumentId)
      .select()
      .single();
  } else {
    row.account_id = session.user.id;
    result = await supabaseClient
      .from("instruments")
      .insert(row)
      .select()
      .single();
  }

  btn.disabled = false;

  if(result.error){
    hint.style.color = "var(--alert)";
    // Cas particulier : limite de 20 instruments par compte (cf. trigger
    // Postgres check_instrument_limit — même convention de message que la
    // limite de 20 résultats sauvegardés côté simulations.html) — affiché
    // tel quel, sans le préfixe générique, pour rester une info actionnable.
    hint.textContent = result.error.message.indexOf("Limite de") === 0
      ? result.error.message
      : "Échec de l'enregistrement : " + result.error.message;
    return;
  }

  // Premier enregistrement d'un nouvel instrument : on retient son id
  // (les sauvegardes suivantes deviennent des mises à jour, pas de
  // nouvelles lignes) et on reflète ça dans l'URL sans recharger la page.
  if(!state.instrumentId && result.data){
    state.instrumentId = result.data.id;
    var newUrl = window.location.pathname + "?id=" + result.data.id;
    window.history.replaceState(null, "", newUrl);
  }

  hint.style.color = "var(--ok)";
  hint.textContent = "Enregistré.";

  // Retour vers simulations.html, étape 3, si on vient de là (cf.
  // returnTarget ci-dessus) — uniquement à la toute première sauvegarde
  // (result.data.id vient d'être créé juste au-dessus) : une fois
  // revenu, on ne veut plus re-rediriger sur d'éventuelles sauvegardes
  // suivantes de cette même session sur cette page.
  if(returnTarget === "simulations" && result.data){
    window.location.href = "simulations.html?newInstrument=" + result.data.id;
    return;
  }
}

function updateProgress(){
  var pct = overallPct();
  document.getElementById("pctLabel").textContent = pct + " %";
  document.getElementById("pctFill").style.width = pct + "%";
}

document.getElementById("btnFile").addEventListener("click", function(){
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);

      // Format réel du paramFile EO_Toolbox (imbriqué, Telescope/Detector/...)
      // — même structure que produit paramfile_builder.py côté serveur.
      // Chaque champ est optionnel : un paramFile partiel ne casse pas
      // l'import, il remplit juste ce qu'il peut.
      if(data.Telescope || data.Detector){
        var tel = data.Telescope || {};
        var det = data.Detector || {};

        if(tel.D != null) state.values.D = tel.D;
        if(tel.iFoV != null) state.values.I = tel.iFoV * 1e6;               // rad -> µrad
        if(tel.central_obscuration != null) state.values.E = tel.central_obscuration;
        if(tel.T_opt_spectral && tel.T_opt_spectral.values && tel.T_opt_spectral.values.length){
          var tVals = tel.T_opt_spectral.values;
          state.values.T = tVals.reduce(function(a,b){return a+b;}, 0) / tVals.length;
        }
        // W (WFE RMS) : pas de champ scalaire direct dans un paramFile — le
        // front d'onde y est décrit par des coefficients de Zernike (CSV
        // séparé), pas importé ici. Laissé tel quel (vide ou valeur déjà
        // saisie), à renseigner manuellement si besoin.

        if(det.pixel_pitch != null) state.values.PX = det.pixel_pitch * 1e6; // m -> µm
        if(det.read_noise != null) state.values.R = det.read_noise;
        if(det.prnu_sigma != null) state.values.P = det.prnu_sigma * 100;    // fraction -> %
        if(det.dark_current != null) state.values.K = det.dark_current;
        if(det.full_well != null) state.values.FW = det.full_well;
        if(det.bits != null) state.values.ADC = det.bits;
        if(det.QE_spectral && det.QE_spectral.values && det.QE_spectral.values.length){
          var qVals = det.QE_spectral.values;
          state.values.QE = (qVals.reduce(function(a,b){return a+b;}, 0) / qVals.length) * 100;
        }
      } else {
        // Ancien format "plat" (clés directement D/I/E/T/W/PX/R/P/K/FW/QE/ADC)
        // — gardé pour compatibilité si un tel fichier existe déjà quelque part.
        Object.keys(data).forEach(function(k){ state.values[k] = data[k]; });
      }

      persist();
      updateProgress(); renderChain(); renderPanel();
    }catch(err){
      alert("Fichier illisible : JSON attendu.");
    }
  };
  reader.readAsText(file);
});

(async function(){
  var session = await requireAuth();
  if(!session) return; // requireAuth a déjà redirigé vers login.html

  await loadInstrument(); // no-op si pas de ?id= dans l'URL (création)
  updateProgress();
  renderSchema();
  renderChain();
  renderPanel();
})();
</script>
