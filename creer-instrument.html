/**
 * Sauvegarde réelle dans Supabase — insertion si c'est un nouvel
 * instrument (state.instrumentId encore vide), mise à jour sinon.
 * Le nom est requis : impossible de sauvegarder un instrument sans nom
 * (il deviendrait illisible dans la liste "Mes instruments").
 *
 * Limite de 20 instruments par compte — appliquée côté base (trigger
 * Postgres "check_instrument_limit" sur la table "instruments", pas ici)
 * pour ne pas pouvoir être contournée en modifiant juste le front. Rien à
 * faire ici pour ça, sauf afficher le message d'erreur qui en revient
 * (cf. plus bas). Migration SQL nécessaire si le trigger n'existe pas
 * encore :
 *
 *   create or replace function check_instrument_limit()
 *   returns trigger as $$
 *   begin
 *     if (select count(*) from instruments where account_id = new.account_id) >= 20 then
 *       raise exception 'Limite de 20 instruments atteinte. Supprimez-en un pour en créer un nouveau.';
 *     end if;
 *     return new;
 *   end;
 *   $$ language plpgsql;
 *
 *   drop trigger if exists trg_check_instrument_limit on instruments;
 *   create trigger trg_check_instrument_limit
 *     before insert on instruments
 *     for each row execute function check_instrument_limit();
 */
async function saveToSupabase(){
  var btn = document.getElementById("btnSave");
  var name = document.getElementById("instName").value.trim();

  var oldHint = panelEl.querySelector(".savehint");
  if(oldHint) oldHint.remove();

  if(!name){
    var errHint = document.createElement("p");
    errHint.className = "savehint";
    errHint.style.color = "var(--alert)";
    errHint.textContent = "Donnez un nom à l'instrument avant de l'enregistrer.";
    panelEl.appendChild(errHint);
    document.getElementById("instName").focus();
    return;
  }

  var invalid = invalidEntries();
  if(invalid.length){
    var invHint = document.createElement("p");
    invHint.className = "savehint";
    invHint.style.color = "var(--alert)";
    invHint.textContent = "À corriger avant d'enregistrer : " + invalid.join(" ; ") + ".";
    panelEl.appendChild(invHint);
    return;
  }
  // Brouillon : enregistré quand même, avec la liste de ce qui manque. Les
  // deux clés commencent par « _ » : ce ne sont pas des saisies.
  var missing = missingRequired();
  state.values._draft = missing.length > 0;
  state.values._missing = missing;
  state.values._pct = overallPct(); // avancement affiché sur la carte de « Mes objets"

  btn.disabled = true;
  var hint = document.createElement("p");
  hint.className = "savehint";
  hint.textContent = "Enregistrement…";
  panelEl.appendChild(hint);

  var session = await requireAuth();
  if(!session) return; // requireAuth a déjà redirigé vers login.html

  var row = { name: name, config: state.values, updated_at: new Date().toISOString() };

  var result;
  if(state.instrumentId){
    result = await supabaseClient
      .from("instruments")
      .update(row)
      .eq("id", state.instrumentId)
      .select()
      .single();
  } else {
    row.account_id = session.user.id;
    result = await supabaseClient
      .from("instruments")
      .insert(row)
      .select()
      .single();
  }

  btn.disabled = false;

  if(result.error){
    hint.style.color = "var(--alert)";
    // Cas particulier : limite de 20 instruments par compte (cf. trigger
    // Postgres check_instrument_limit — même convention de message que la
    // limite de 20 résultats sauvegardés côté simulations.html) — affiché
    // tel quel, sans le préfixe générique, pour rester une info actionnable.
    hint.textContent = result.error.message.indexOf("Limite de") === 0
      ? result.error.message
      : "Échec de l'enregistrement : " + result.error.message;
    return;
  }

  // Premier enregistrement d'un nouvel instrument : on retient son id
  // (les sauvegardes suivantes deviennent des mises à jour, pas de
  // nouvelles lignes) et on reflète ça dans l'URL sans recharger la page.
  if(!state.instrumentId && result.data){
    state.instrumentId = result.data.id;
    var newUrl = window.location.pathname + "?id=" + result.data.id;
    window.history.replaceState(null, "", newUrl);
  }

  markSaved(); // l'état enregistré devient la référence

  // 04/10/2026 — après un enregistrement réussi, retour au menu principal
  // (« Mes objets »). Exception : instrument complet créé depuis la page
  // Simulations (returnTarget), qui y retourne comme avant. Pour un
  // brouillon, le message qui liste ce qui manque reste affiché 3 secondes
  // avant le retour, sinon il ne serait jamais lu.
  if(missing.length){
    hint.style.color = "var(--photon)";
    hint.textContent = "Enregistré comme brouillon. Il manque : " + missing.join(", ") + ".";
    setTimeout(function(){ window.location.href = "espace-personnel.html"; }, 3000);
    return;
  }
  hint.style.color = "var(--ok)";
  hint.textContent = "Enregistré.";
  if(returnTarget === "simulations" && result.data){
    window.location.href = "simulations.html?newInstrument=" + result.data.id;
    return;
  }
  window.location.href = "espace-personnel.html";
}

// ===================== Export de la configuration (04/10/2026) =====================
// Au moins une saisie : un champ rempli, un point de courbe ou un cas WFE.
function hasAnyEntry(){
  return Object.keys(state.values).some(function(k){
    if(k.charAt(0) === "_") return false; // clés internes (_draft, _missing)
    var v = state.values[k];
    if(Array.isArray(v)) return v.length > 0;
    return v !== undefined && v !== null && v !== "";
  });
}
// Construit un fichier au FORMAT DU PARAMFILE (mêmes blocs Telescope /
// Detector, mêmes clés et mêmes unités SI que le backend), pour qu'il soit
// relisible par « Charger une configuration ». Seuls les champs saisis sont
// écrits. Ce que le paramFile ne sait pas porter (nom, WFE RMS, cas WFE,
// mode « pleine échelle ») va dans un bloc "Formulaire".
function buildExport(){
  var v = state.values;
  function has(k){ return isFilled(k); }
  function num(k){ return Number(v[k]); }
  function clean(x){ return Number(Number(x).toPrecision(12)); } // évite 2.0000000000000003e-6
  var tel = {}, det = {}, form = {};

  if(has("D")) tel.D = num("D");
  if(has("I")) tel.iFoV = clean(num("I") * 1e-6);                       // µrad -> rad
  if(has("E")) tel.central_obscuration = num("E");
  if(num("E") > 0 && has("NSUP")) tel.n_supports = num("NSUP");
  if(num("E") > 0 && has("ESUP")) tel.support_width = num("ESUP");
  var tCurve = exportCurve("T");
  if(tCurve) tel.T_opt_spectral = tCurve;

  if(has("PX")) det.pixel_pitch = clean(num("PX") * 1e-6);              // µm -> m
  var qeCurve = exportCurve("QE");
  if(qeCurve) det.QE_spectral = qeCurve;
  if(has("FW")) det.full_well = num("FW");
  if(has("R")) det.read_noise = num("R");
  if(has("K")) det.dark_current = num("K");
  if(has("P")) det.prnu_sigma = clean(num("P") / 100);                  // % -> fraction
  if(has("dsnu_1288")) det.dsnu_1288 = num("dsnu_1288");
  if(has("dsnu_T_ref")) det.dsnu_T_ref = num("dsnu_T_ref");
  if(has("ADC")) det.bits = num("ADC");
  if(v.electronics_mode === "detailed"){
    if(has("CVF_uV_per_e")) det.CVF_uV_per_e = num("CVF_uV_per_e");
    if(has("G_PGA")) det.G_PGA = num("G_PGA");
    if(has("V_range")) det.V_range = num("V_range");
  } else if(v.electronics_mode === "datasheet"){
    if(has("CWF")) det.CWF = num("CWF");
  }
  if(has("DN0")) det.DN0 = num("DN0");
  if(has("bits_TDI")) det.bits_TDI = num("bits_TDI");

  var name = document.getElementById("instName").value.trim();
  if(name) form.name = name;
  if(v.electronics_mode) form.electronics_mode = v.electronics_mode;
  if(has("W")) form.WFE_RMS_nm = num("W");
  if((v.wfeCases || []).length) form.wfeCases = v.wfeCases;

  var out = {};
  if(Object.keys(form).length) out.Formulaire = form;
  if(Object.keys(tel).length) out.Telescope = tel;
  if(Object.keys(det).length) out.Detector = det;
  return out;
}
// Courbe {wavelength_nm, values} d'un champ spectral : les points saisis en
// mode « Courbe », une courbe plate en mode « Valeur constante » (même
// convention que l'envoi dans simulations.html), ou null si rien n'est saisi.
function exportCurve(fieldKey){
  var lock = SPECTRAL_LOCKS[fieldKey];
  if(spectralActive(fieldKey)){
    var pts = curveStatus(state.values[lock.arr], lock.key).valid.sort(function(a,b){ return a.wl - b.wl; });
    if(pts.length < 2) return null;
    return { wavelength_nm: pts.map(function(p){ return p.wl; }), values: pts.map(function(p){ return p.qe; }) };
  }
  if(!isFilled(fieldKey)) return null;
  var c = Number(state.values[fieldKey]);
  return { wavelength_nm: [300, 1100], values: [c, c] };
}
document.getElementById("btnExport").addEventListener("click", function(){
  var name = document.getElementById("instName").value.trim();
  var slug = (name || "instrument").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "instrument";
  var blob = new Blob([JSON.stringify(buildExport(), null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = slug + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
});
// Relecture d'une courbe {wavelength_nm, values} à l'import : valeurs toutes
// égales -> mode « Valeur constante » ; sinon -> mode « Courbe » avec ses points.
function importCurve(fieldKey, curve){
  var lock = SPECTRAL_LOCKS[fieldKey];
  var vals = (curve && curve.values) || [], wls = (curve && curve.wavelength_nm) || [];
  if(!vals.length) return;
  var flat = vals.every(function(x){ return x === vals[0]; });
  if(flat || wls.length !== vals.length){
    state.values[fieldKey] = flat ? vals[0] : vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
    state.values[lock.mode] = "constant";
  } else {
    state.values[lock.arr] = vals.map(function(x, i){ var p = { wl: String(wls[i]) }; p[lock.key] = String(x); return p; });
    state.values[lock.mode] = "curve";
  }
}

document.getElementById("fileInput").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);

      // 04/10/2026 — le fichier REMPLACE la saisie en cours au lieu de s'y
      // ajouter (avant, charger un second fichier mélangeait deux
      // instruments). Confirmation si le formulaire contient déjà quelque
      // chose. L'instrument ouvert reste le même : seul son contenu change.
      if(hasAnyEntry() && !confirm("Charger ce fichier remplace toute la saisie en cours. Continuer ?")) return;
      state.values = {};

      // Format réel du paramFile EO_Toolbox (imbriqué, Telescope/Detector/...)
      // — même structure que produit paramfile_builder.py côté serveur.
      // Chaque champ est optionnel : un paramFile partiel ne casse pas
      // l'import, il remplit juste ce qu'il peut.
      if(data.Telescope || data.Detector || data.Formulaire){
        var tel = data.Telescope || {};
        var det = data.Detector || {};

        if(tel.D != null) state.values.D = tel.D;
        if(tel.iFoV != null) state.values.I = tel.iFoV * 1e6;               // rad -> µrad
        if(tel.central_obscuration != null) state.values.E = tel.central_obscuration;
        if(tel.n_supports != null) state.values.NSUP = tel.n_supports;
        if(tel.support_width != null) state.values.ESUP = tel.support_width;
        // Courbe plate -> valeur constante ; sinon -> mode courbe (04/10/2026).
        importCurve("T", tel.T_opt_spectral);
        // W (WFE RMS) : pas de champ scalaire direct dans un paramFile — le
        // front d'onde y est décrit par des coefficients de Zernike (CSV
        // séparé), pas importé ici. Laissé tel quel (vide ou valeur déjà
        // saisie), à renseigner manuellement si besoin.

        if(det.pixel_pitch != null) state.values.PX = det.pixel_pitch * 1e6; // m -> µm
        if(det.read_noise != null) state.values.R = det.read_noise;
        if(det.prnu_sigma != null) state.values.P = det.prnu_sigma * 100;    // fraction -> %
        if(det.dark_current != null) state.values.K = det.dark_current;
        if(det.full_well != null) state.values.FW = det.full_well;
        if(det.bits != null) state.values.ADC = det.bits;
        // QE en fraction (0-1), comme le champ du formulaire.
        importCurve("QE", det.QE_spectral);
        if(det.dsnu_1288 != null) state.values.dsnu_1288 = det.dsnu_1288;
        if(det.dsnu_T_ref != null) state.values.dsnu_T_ref = det.dsnu_T_ref;
        if(det.DN0 != null) state.values.DN0 = det.DN0;
        if(det.bits_TDI != null) state.values.bits_TDI = det.bits_TDI;
        // Mode d'électronique déduit des clés présentes ; sans aucune clé,
        // on ne suppose rien : le mode reste à choisir.
        if(det.CVF_uV_per_e != null || det.V_range != null){
          state.values.electronics_mode = "detailed";
          if(det.CVF_uV_per_e != null) state.values.CVF_uV_per_e = det.CVF_uV_per_e;
          if(det.G_PGA != null) state.values.G_PGA = det.G_PGA;
          if(det.V_range != null) state.values.V_range = det.V_range;
        } else if(det.CWF != null || det.LSB != null){
          state.values.electronics_mode = "datasheet";
          state.values.CWF = det.CWF != null ? det.CWF : 1 / det.LSB;
        }
        // Bloc "Formulaire" d'un fichier exporté d'ici : ce que le paramFile
        // ne porte pas (nom, WFE RMS, cas WFE, mode « pleine échelle »).
        var form = data.Formulaire || {};
        if(form.name) document.getElementById("instName").value = form.name;
        if(form.electronics_mode) state.values.electronics_mode = form.electronics_mode;
        if(form.WFE_RMS_nm != null) state.values.W = form.WFE_RMS_nm;
        if(Array.isArray(form.wfeCases)) state.values.wfeCases = form.wfeCases;
      } else {
        // Ancien format "plat" (clés directement D/I/E/T/W/PX/R/P/K/FW/QE/ADC)
        // — gardé pour compatibilité si un tel fichier existe déjà quelque part.
        Object.keys(data).forEach(function(k){ state.values[k] = data[k]; });
      }

      persist();
      updateProgress(); renderChain(); renderPanel();
    }catch(err){
      alert("Fichier illisible : JSON attendu.");
    }
  };
  reader.readAsText(file);
  e.target.value = ""; // permet de recharger le même fichier ensuite
});

(async function(){
  var session = await requireAuth();
  if(!session) return; // requireAuth a déjà redirigé vers login.html

  await loadInstrument(); // no-op si pas de ?id= dans l'URL (création)
  markSaved(); // référence pour détecter les modifications non enregistrées
  updateProgress();
  renderSchema();
  renderChain();
  renderPanel();
})();
</script>
</body>
