<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-mail validé | Nysa</title>
<!-- Page d'arrivée du lien de confirmation envoyé par e-mail à l'inscription (11/10/2026).
     Elle confirme seulement que l'adresse est validée : aucun tutoriel ni fenêtre de bienvenue ici.
     Le lien de confirmation ouvre une session sur l'appareil qui le reçoit (souvent le téléphone) :
     elle est refermée ici, sur cet appareil seulement, pour que la première vraie connexion
     (et la fenêtre de bienvenue) ait lieu sur l'appareil où la personne veut travailler. -->
<script src="i18n.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Ccircle%20cx%3D%2224.00%22%20cy%3D%2213.70%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2232.92%22%20cy%3D%2218.85%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2232.92%22%20cy%3D%2229.15%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2224.00%22%20cy%3D%2234.30%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2215.08%22%20cy%3D%2229.15%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2215.08%22%20cy%3D%2218.85%22%20r%3D%229.7%22%20fill%3D%22none%22%20stroke%3D%22%234FD1C5%22%20stroke-width%3D%223.6%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%225.3%22%20fill%3D%22%23FFB86B%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/supabase.js"></script>
<style>
:root{
  --void:#090E13; --panel:#131E27; --panel-2:#1A2833;
  --line:#2E4152; --line-soft:#22323F;
  --paper:#C4D6D4; --muted:#9BADBD; --muted-2:#8497AA;
  --photon:#F5AC57; --pixel:#5FDCD0; --alert:#F0776D; --ok:#7FD88F;
  --display:"Montserrat","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--void);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:8px;padding:32px 30px;position:relative}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:30px}
.brand .mark{flex:none;width:42px;height:42px;display:block}
.brand .mark svg{width:100%;height:100%;display:block}
.brand .name{font-family:var(--display);font-weight:500;font-size:27px;letter-spacing:.035em;line-height:1.05}
.brand .tag{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.115em;color:var(--muted-2);margin-top:4px;white-space:nowrap}
.status{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.status .ico{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--ok);color:var(--ok)}
.status .ico svg{width:18px;height:18px}
.status.warn .ico{border-color:var(--photon);color:var(--photon)}
h1{font-family:var(--display);font-weight:500;font-size:21px;margin:0;letter-spacing:-.012em}
.sub{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0 0 24px}
.submitbtn{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid var(--pixel);background:var(--pixel);color:#0A141A;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em;
  padding:11px 18px;border-radius:5px;cursor:pointer;
  box-shadow:0 2px 10px rgba(95,220,208,.22);transition:background .14s}
.submitbtn:hover{background:#7CE8DC}
</style>
</head>
<body>
<script src="beta.js"></script>
<div class="card">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24.00" cy="13.70" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="32.92" cy="18.85" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="32.92" cy="29.15" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="24.00" cy="34.30" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="15.08" cy="29.15" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="15.08" cy="18.85" r="9.7" fill="none" stroke="#4FD1C5" stroke-width="3.0"/><circle cx="24" cy="24" r="5.3" fill="#FFB86B"/></svg></span>
    <span>
      <div class="name">Nysa</div>
      <div class="tag">EO Imaging Engineering</div>
    </span>
  </div>

  <div class="status" id="status">
    <span class="ico" id="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <h1 id="title"></h1>
  </div>
  <p class="sub" id="text"></p>
  <a class="submitbtn" id="loginBtn" href="login.html"></a>
</div>

<script src="supabase-client.js"></script>
<script>
// Textes de cette page (courts, propres à elle) : français et anglais.
var TXT = {
  fr: {
    doc: "E-mail validé | Nysa",
    okTitle: "E-mail validé",
    okText: "Votre adresse e-mail est confirmée. Vous pouvez maintenant vous connecter à Nysa, depuis cet appareil ou depuis votre ordinateur.",
    badTitle: "Lien non valable",
    badText: "Ce lien a expiré ou a déjà été utilisé. Si vous l'avez déjà ouvert, votre adresse est probablement validée : essayez simplement de vous connecter.",
    btn: "Se connecter"
  },
  en: {
    doc: "Email verified | Nysa",
    okTitle: "Email verified",
    okText: "Your email address is confirmed. You can now sign in to Nysa, from this device or from your computer.",
    badTitle: "Invalid link",
    badText: "This link has expired or has already been used. If you have already opened it, your address is probably verified: just try signing in.",
    btn: "Sign in"
  }
};

function pickLang(l){ return l === "en" ? "en" : (l === "fr" ? "fr" : null); }
function render(lang, ok){
  var tx = TXT[lang] || TXT.fr;
  document.documentElement.lang = lang;
  document.title = tx.doc;
  document.getElementById("title").textContent = ok ? tx.okTitle : tx.badTitle;
  document.getElementById("text").textContent = ok ? tx.okText : tx.badText;
  document.getElementById("loginBtn").textContent = tx.btn;
  document.getElementById("status").classList.toggle("warn", !ok);
  if(!ok) document.getElementById("ico").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"/></svg>';
}

// Lien en erreur (expiré, déjà utilisé) : Supabase l'indique dans l'adresse.
var linkFailed = /error=|error_code=/.test(window.location.hash + window.location.search);
var lang = pickLang(typeof nysaLang === "function" ? nysaLang() : null) || "fr";
render(lang, !linkFailed);

// Le lien de confirmation ouvre une session sur cet appareil. On lit la langue du compte (pour afficher la page dans
// la bonne langue même sur un téléphone où le site n'a jamais été ouvert), puis on referme cette session ICI seulement
// (scope "local" : les autres appareils ne sont pas touchés). Ainsi la fenêtre de bienvenue s'ouvrira à la première
// vraie connexion, sur l'appareil où la personne veut travailler.
(async function(){
  try {
    var session = null;
    for (var i = 0; i < 8 && !session && !linkFailed; i++) {
      var res = await supabaseClient.auth.getSession();
      session = res.data.session;
      if (!session) await new Promise(function(r){ setTimeout(r, 400); });
    }
    if (session) {
      var pref = pickLang(session.user.user_metadata ? session.user.user_metadata.lang : null);
      if (pref && pref !== lang) render(pref, !linkFailed);
      await supabaseClient.auth.signOut({ scope: "local" });
      try { localStorage.removeItem(SESSION_MARKER_KEY); } catch (e) { /* sans gravité */ }
    }
  } catch (e) {
    console.warn("Page e-mail validé :", e);
  }
})();
</script>
</body>
</html>
